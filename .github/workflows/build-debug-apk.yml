name: Build Debug APK

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install X11/fontconfig libraries and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxext6 libxrender1 libxtst6 libxi6 libfontconfig1 libfreetype6

      - name: Build debug APK
        run: xvfb-run -a ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare artifact name
        id: prepare
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Rename APK with short SHA
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "moememos-debug-${{ steps.prepare.outputs.safe_branch }}-${{ steps.prepare.outputs.short_sha }}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moememos-debug-${{ steps.prepare.outputs.safe_branch }}-${{ steps.prepare.outputs.short_sha }}
          path: moememos-debug-*.apk
          retention-days: 90
          if-no-files-found: error
